<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Logic model inspection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7e7e4;color:#292b28;font:14px system-ui}header{padding:22px 28px;background:#f5f5f2}h1{font-size:22px;margin:0 0 6px}p{margin:0;color:#61655d}main{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#c6c8c0}figure{margin:0;background:#dededb;text-align:center}img{display:block;width:100%;aspect-ratio:1.15;object-fit:contain}figcaption{padding:9px 8px 15px;font-weight:600}a{color:inherit}nav{margin-top:12px}
</style></head><body><header><h1>Logic models · close inspection</h1><p>Consistent orthographic views, neutral lighting. Model proportions remain estimates from the visual references.</p><nav><a href="?view=all">All components</a> · <a href="?view=lever">Lever on / off</a></nav></header><main></main>
<script type="module">
import * as T from 'three';
import {CATALOG,ITEMS} from '/src/catalog.ts';
import {logicGeometryFor} from '/src/geometry.ts';
import {preloadMaterials,makeMaterials} from '/src/materials.ts';
import {makeLogicMaterials} from '/src/logic-geometry.ts';
await preloadMaterials();
const mats=makeLogicMaterials(makeMaterials().get('walnut'));
const r=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
r.setSize(460,400);r.setPixelRatio(1);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1;
const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x888b80,1.6));
const key=new T.DirectionalLight(0xffffff,2.2);key.position.set(-3,8,5);scene.add(key);
const mesh=new T.Mesh();scene.add(mesh);
const lever=new URLSearchParams(location.search).get('view')==='lever';
const entries=lever?[
 {id:'lever',on:false,top:false,label:'OFF · three quarter'},
 {id:'lever',on:true,top:false,label:'ON · three quarter'},
 {id:'lever',on:false,top:true,label:'OFF · top (output ↓)'},
 {id:'lever',on:true,top:true,label:'ON · top (output ↓)'},
]:CATALOG.filter(i=>i.category==='Logic').map(i=>({id:i.id,on:false,top:false,label:i.name}));
for(const entry of entries){
 const item=ITEMS.get(entry.id),span=Math.max(...item.size)*1.32;
 const camera=new T.OrthographicCamera(-span*.575,span*.575,span*.5,-span*.5,.01,100);
 if(entry.top){camera.up.set(-1,0,0);camera.position.set(0,10,0);}else camera.position.set(7,6.3,7);
 camera.lookAt(0,0,0);mesh.geometry=logicGeometryFor(entry.id,entry.on,1);mesh.material=mats.get(entry.id);
 r.render(scene,camera);
 const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');
 img.src=r.domElement.toDataURL('image/png');img.alt=entry.label;caption.textContent=entry.label;
 figure.append(img,caption);document.querySelector('main').append(figure);
}
r.dispose();document.body.dataset.ready='true';
</script></body></html>
